<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vapor hydration</title>
</head>

<body>
  <div id="app"></div>
</body>

</html>
<script type="module">
  import { genHtml } from './init.js';
  document.getElementById("app").innerHTML = genHtml();
</script>
<script type="module">
  import { createVaporSSRApp, nextTick } from "./libs/vue.runtime-with-vapor.esm-browser.prod.js";
  import App from './components/VaporApp.js';
  performance.mark('vue-hydration-start')
  createVaporSSRApp(App).mount("#app");
  performance.mark('vue-hydration-end')
  nextTick().then(() => {
    performance.measure('vue-hydration-total', 'vue-hydration-start', 'vue-hydration-end')

    const measures = performance.getEntriesByName('vue-hydration-total')
    console.log(measures[0].duration);
  });
</script>
